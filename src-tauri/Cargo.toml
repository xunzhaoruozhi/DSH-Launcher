[package]
name = "dsh-launcher"
version = "0.7.2"
description = "Desktop launcher for DeepSeek Harness"
authors = ["DSH Launcher contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "dsh_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "devtools"] }
tauri-plugin-dialog = "2"
rfd = "0.16"
ureq = "2"
tauri-plugin-global-shortcut = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# 标签拖出窗口（windows_ui.rs）轮询键态/光标 + 命中测试；theme_sync.rs 取窗口矩形。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi"] }
webview2-com = "0.38"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }

# 只有 macOS 用它做标题栏的原生振动模糊，别让 Windows/Linux 白编译一遍。
[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.5"
